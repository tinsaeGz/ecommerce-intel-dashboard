[project]
name = "suq-insights-api"
version = "0.1.0"
description = "FastAPI and Celery entry points for Suq Insights"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.6,<6",
  "fastapi>=0.128,<1",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.19,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.15,<1",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.hatch.build.targets.wheel]
packages = ["src/suq_api"]

[tool.uv]
package = true
