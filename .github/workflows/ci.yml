name: CI

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  DOCKER_CONTEXT: default
  DOCKER_HOST: unix:///var/run/docker.sock
  PATH: /home/tensu/.local/bin:/usr/local/bin:/usr/bin:/bin

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: affected-subsystems
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 5
    outputs:
      web: ${{ steps.select.outputs.web }}
      mobile: ${{ steps.select.outputs.mobile }}
      packages: ${{ steps.select.outputs.packages }}
      api: ${{ steps.select.outputs.api }}
      contract: ${{ steps.select.outputs.contract }}
      docs: ${{ steps.select.outputs.docs }}
      security: ${{ steps.select.outputs.security }}
      containers: ${{ steps.select.outputs.containers }}
      migrations: ${{ steps.select.outputs.migrations }}
      deploy_web: ${{ steps.select.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected subsystem suites
        id: select
        run: python3 .github/scripts/affected.py

  workflow:
    name: workflow-policy
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require dev as source of production PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        run: exit 1
      - name: Test change selection and aggregate gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Lint workflow syntax
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 .github/workflows/ci.yml

  frontend:
    name: frontend-lint-types-tests-build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version
      - run: npm ci --prefer-offline
      - name: Frontend suite including locales and accessibility
        run: |
          npm run lint --workspace @suq-insights/web
          npm run typecheck --workspace @suq-insights/web
          npm run test --workspace @suq-insights/web
          npm run build:web

  mobile:
    name: mobile-lint-types-tests-build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version
      - run: npm ci --prefer-offline
      - name: Mobile suite and Android export
        run: |
          npm run lint --workspace @suq-insights/mobile
          npm run typecheck --workspace @suq-insights/mobile
          npm run test --workspace @suq-insights/mobile
          npm run build:mobile

  packages:
    name: shared-package-checks
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version
      - run: npm ci --prefer-offline
      - name: Shared package suites and generated tokens
        run: |
          npm run check:generated --workspace @suq-insights/design-tokens
          npm run build:packages
          npm run test --workspace @suq-insights/api-client
          npm run test --workspace @suq-insights/shared-types

  backend:
    name: backend-lint-types-tests-coverage-audit
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted uv
        run: uv --version
      - run: uv sync --project apps/api --locked --all-groups
      - name: Backend quality and coverage
        run: |
          npm run check:api
          python3 .github/scripts/domain_coverage.py /tmp/suq-coverage.json
      - name: CI script lint
        run: |
          uv run --project apps/api ruff format --check .github/scripts deploy/smoke.py
          uv run --project apps/api ruff check --select E,F,I,UP .github/scripts deploy/smoke.py

  contract:
    name: openapi-and-generated-client
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version
      - run: npm ci --prefer-offline
      - name: Verify self-hosted uv
        run: uv --version
      - run: uv sync --project apps/api --locked --all-groups
      - name: Verify API and generated client together
        run: |
          npm run generate:openapi
          npm run generate:api-client
          git diff --exit-code -- packages/api-client/openapi.json packages/api-client/src/schema.d.ts
          npm run typecheck --workspace @suq-insights/api-client
          npm run test --workspace @suq-insights/api-client

  docs:
    name: documentation-lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version
      - run: npm ci --prefer-offline --workspaces=false
      - name: Lint documentation
        run: |
          npm run lint:docs

  migrations:
    name: migration-readiness
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate migration harness or report absent schema
        run: |
          python3 .github/scripts/migrations.py

  security:
    name: dependency-and-secret-scans
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Trivy
        run: trivy --version
      - name: Scan dependencies and redact secret findings
        run: |
          python3 .github/scripts/security.py

  integration:
    name: container-integration-and-image-scan
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify self-hosted Trivy
        run: trivy --version
      - name: Validate and start real-service stack
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yml -p suq-ci config --quiet
          docker compose --env-file deploy/.env.example -f deploy/compose.yml -p suq-ci up --build --detach --wait --wait-timeout 180
      - name: Real-service and routing smoke checks
        run: python3 deploy/smoke.py --env-file deploy/.env.example --project-name suq-ci
      - name: Scan built application and service images
        run: |
          docker compose --env-file deploy/.env.example -f deploy/compose.yml -p suq-ci images --format json \
            | python3 -c 'import json, sys; print("\n".join(sorted({"{}:{}".format(image["Repository"], image["Tag"]) for image in json.load(sys.stdin)})))' \
            > /tmp/suq-images
          test -s /tmp/suq-images
          scan_status=0
          while IFS= read -r image_ref; do
            trivy image --scanners vuln --severity CRITICAL --exit-code 1 "$image_ref" || scan_status=1
          done < /tmp/suq-images
          exit "$scan_status"
      - name: Failure diagnostics
        if: failure()
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml -p suq-ci logs --no-color --tail 100
      - name: Remove ephemeral stack
        if: always()
        run: docker compose --env-file deploy/.env.example -f deploy/compose.yml -p suq-ci down --volumes

  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, workflow, frontend, mobile, packages, backend, contract, docs, security, integration, migrations]
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every selected check to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/gate.py

  deploy:
    name: deploy-${{ github.ref_name }}
    if: ${{ !cancelled() && github.event_name == 'push' && needs.ci-gate.result == 'success' && needs.changes.outputs.deploy_web == 'true' }}
    needs:
      - changes
      - ci-gate
    permissions:
      contents: read
      deployments: write
    runs-on: [self-hosted, linux, x64, suq-ci]
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify self-hosted Node.js
        run: |
          node --version
          npm --version

      - name: Build and deploy to Vercel
        id: deploy
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            target_environment="production"
            production_flag="--prod"
          else
            target_environment="preview"
            production_flag=""
          fi

          npx --yes vercel@59.11.2 pull \
            --yes \
            --environment="$target_environment" \
            --token="$VERCEL_TOKEN"
          npx --yes vercel@59.11.2 build \
            $production_flag \
            --token="$VERCEL_TOKEN"

          deployment_dir="$RUNNER_TEMP/vercel-deployment"
          mkdir -p "$deployment_dir/.vercel"
          cp -R .vercel/output "$deployment_dir/.vercel/output"
          cp .vercel/project.json "$deployment_dir/.vercel/project.json"

          deployment_url=$(npx --yes vercel@59.11.2 deploy "$deployment_dir" \
            --prebuilt \
            $production_flag \
            --token="$VERCEL_TOKEN" \
            --no-color)

          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            npx --yes vercel@59.11.2 alias set \
              "$deployment_url" \
              ecommerce-intel-dashboard-dev.vercel.app \
              --token="$VERCEL_TOKEN"
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed web route
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: python3 .github/scripts/deployment_smoke.py
