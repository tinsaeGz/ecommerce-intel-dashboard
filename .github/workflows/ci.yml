name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source of production pull requests
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        run: |
          echo "Pull requests into main must come from dev."
          exit 1

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Upload web build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  api-quality:
    name: api-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked --all-groups

      - name: Run API checks
        run: npm run check:api

      - name: Verify the checked-in OpenAPI contract
        run: |
          npm run generate:openapi
          git diff --exit-code -- packages/api-client/openapi.json

  deploy:
    name: deploy-${{ github.ref_name }}
    if: github.event_name == 'push'
    needs:
      - api-quality
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and deploy to Vercel
        id: deploy
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            target_environment="production"
            production_flag="--prod"
          else
            target_environment="preview"
            production_flag=""
          fi

          npx --yes vercel@59.11.2 pull \
            --yes \
            --environment="$target_environment" \
            --token="$VERCEL_TOKEN"
          npx --yes vercel@59.11.2 build \
            $production_flag \
            --token="$VERCEL_TOKEN"

          deployment_dir="$RUNNER_TEMP/vercel-deployment"
          mkdir -p "$deployment_dir/.vercel"
          cp -R .vercel/output "$deployment_dir/.vercel/output"
          cp .vercel/project.json "$deployment_dir/.vercel/project.json"

          deployment_url=$(npx --yes vercel@59.11.2 deploy "$deployment_dir" \
            --prebuilt \
            $production_flag \
            --token="$VERCEL_TOKEN" \
            --no-color)

          if [[ "$GITHUB_REF_NAME" == "dev" ]]; then
            npx --yes vercel@59.11.2 alias set \
              "$deployment_url" \
              ecommerce-intel-dashboard-dev.vercel.app \
              --token="$VERCEL_TOKEN"
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
